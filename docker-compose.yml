# ─────────────────────────────────────────────────────────────────────────────
# FitAI — Docker Compose (local full-stack development)
# Usage:
#   docker-compose up --build
#
# Frontend: http://localhost:3000
# Backend:  http://localhost:8000
# API docs: http://localhost:8000/docs
# ─────────────────────────────────────────────────────────────────────────────

version: "3.9"

services:
  # ── Python FastAPI ML Backend ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fitai-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    volumes:
      - ./backend/models:/app/models:ro   # Mount models as read-only
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Node.js React/Vite Frontend ────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: fitai-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_ML_API_URL=http://localhost:8000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
